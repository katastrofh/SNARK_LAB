[workspace]
members = [
  "crates/field",
  "crates/multilinear",
  "crates/transcript",
  "crates/sumcheck",
  "crates/zerocheck",
  "crates/permcheck",
  "crates/interchange",
  "crates/benches",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ark-ff = "0.6"
ark-bls12-381 = "0.6"
field = { path = "crates/field" }
multilinear = { path = "crates/multilinear" }
sumcheck = { path = "crates/sumcheck" }
zerocheck = { path = "crates/zerocheck" }
permcheck = { path = "crates/permcheck" }
snark-lab-transcript = { path = "crates/transcript" }
snark-lab-interchange = { path = "crates/interchange" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
panic = "abort"
strip = "symbols"
