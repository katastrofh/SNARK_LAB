version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 2
    groups:
      rust-non-crypto-patches:
        update-types:
          - patch
    ignore:
      - dependency-name: "ark-*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: /web/visualizer
    schedule:
      interval: monthly
      day: monday
      time: "04:20"
    open-pull-requests-limit: 2
    groups:
      visualizer-patches:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "04:40"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
