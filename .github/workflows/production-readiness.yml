name: production-readiness

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/visualizer/package-lock.json

      - name: Install visualizer dependencies
        run: npm --prefix web/visualizer ci

      - name: Pre-fetch Rust dependencies with retry
        run: |
          for attempt in 1 2 3; do
            echo "cargo fetch attempt ${attempt}"
            if cargo fetch --locked; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          cargo fetch --locked

      - name: Run production readiness checks
        run: scripts/check-production-ready.sh
