name: CI Matrix and Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-matrix-and-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Pre-fetch Rust dependencies with retry
        run: |
          for attempt in 1 2 3; do
            echo "cargo fetch attempt ${attempt}"
            if cargo fetch --locked; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          cargo fetch --locked

      - name: Locked metadata
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Fuzz target compile check
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

  visualizer:
    name: Visualizer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/visualizer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/visualizer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

  rustsec:
    name: RustSec audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
